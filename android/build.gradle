allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { project ->
    project.buildDir = layout.buildDirectory.dir("${rootProject.layout.buildDirectory.get()}/${project.name}").get().asFile
    if (project.name != "app") {
        project.evaluationDependsOn(':app')
        // Provide flutter extension fallback for subproject plugins evaluating flutter.compileSdkVersion
        project.ext.set("flutter", [
            compileSdkVersion: 34,
            minSdkVersion: 21,
            targetSdkVersion: 34,
            ndkVersion: "27.0.12077973"
        ])
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
