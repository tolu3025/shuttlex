allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Provide flutter extension fallback for subproject plugins evaluating flutter.compileSdkVersion
    project.ext.set("flutter", [
        compileSdkVersion: 34,
        minSdkVersion: 21,
        targetSdkVersion: 34,
        ndkVersion: "27.0.12077973"
    ])
}

subprojects {
    project.buildDir = layout.buildDirectory.dir("${rootProject.layout.buildDirectory.get()}/${project.name}").get().asFile
    project.evaluationDependsOn(':app')
}

subprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin("com.android.application") || p.plugins.hasPlugin("com.android.library")) {
            p.android {
                compileSdk = 34
                if (namespace == null || namespace.isEmpty()) {
                    namespace = "com.shuttlex.plugin.${p.name.replace('-', '_')}"
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
